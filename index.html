<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sutee — Music Producer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0b0b;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        .hero h1 {
            font-size: clamp(60px, 12vw, 160px);
            letter-spacing: 0.08em;
            font-weight: 300;
        }

        .hero p {
            margin-top: 20px;
            font-size: 18px;
            letter-spacing: 0.25em;
            color: #999;
        }

        .enter {
            display: inline-block;
            margin-top: 50px;
            padding: 14px 32px;
            border: 1px solid #555;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .enter:hover {
            background: white;
            color: black;
        }
    </style>
</head>

<body>

    <section class="hero">

        <div>
            <h1>SUTEE</h1>

            <p>
                MUSIC PRODUCER · COMPOSER · ARRANGER
            </p>

            <a href="#" class="enter">
                ENTER PORTFOLIO
            </a>
        </div>

    </section>

</body>
</html>
