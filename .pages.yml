media:
  input: public/media
  output: /media

content:
  - name: site
    label: Site Settings
    type: file
    path: data/site.json
    format: json
    fields:
      - name: name
        label: Name
        type: string
      - name: bio
        label: Bio
        type: rich-text
      - name: profile_image
        label: Profile Image
        type: image

  - name: music
    label: Music
    type: collection
    path: data/music
    format: json
    fields:
      - name: title
        label: Song Title
        type: string
      - name: artist
        label: Artist
        type: string
      - name: album
        label: Album
        type: string
      - name: year
        label: Year
        type: number
      - name: cover
        label: Cover
        type: image
      - name: audio
        label: Audio
        type: file
      - name: description
        label: Description
        type: rich-text

  - name: works
    label: Works & Credits
    type: collection
    path: data/works
    format: json
    fields:
      - name: title
        label: Project / Album
        type: string
      - name: artist
        label: Artist
        type: string
      - name: year
        label: Year
        type: number
      - name: role
        label: Role
        type: string
      - name: cover
        label: Cover
        type: image
      - name: description
        label: Description
        type: rich-text

  - name: gallery
    label: Gallery
    type: collection
    path: data/gallery
    format: json
    fields:
      - name: title
        label: Title
        type: string
      - name: image
        label: Image
        type: image
      - name: description
        label: Description
        type: rich-text