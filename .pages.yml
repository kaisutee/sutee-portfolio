media:
  input: public/media
  output: /public/media

content:

  # =========================================================
  # SITE SETTINGS
  # =========================================================

  - name: site
    label: Site Settings
    type: file
    path: data/site.json
    format: json
    operations:
      delete: false

    fields:

      - name: name
        label: Name
        type: string
        required: true

      - name: tagline
        label: Tagline
        type: string

      # รูปใหญ่หน้า Main Page
      - name: hero_image
        label: Main Page Cover
        type: image
        options:
          path: public/media
        description: Main image displayed on the homepage

      # รูป Profile
      - name: profile_image
        label: Profile Image
        type: image
        options:
          path: public/media

      - name: bio
        label: Biography
        type: rich-text

      - name: email
        label: Email
        type: string

      - name: facebook
        label: Facebook
        type: string

      - name: instagram
        label: Instagram
        type: string

      - name: youtube
        label: YouTube
        type: string


  # =========================================================
  # MUSIC
  # =========================================================

  - name: music
    label: MUSIC
    type: group
    items:

      # -------------------------------------------------------
      # ARTISTS
      # -------------------------------------------------------

      - name: artists
        label: Artists
        type: collection
        path: data/artists
        format: json
        filename: "{primary}.json"

        fields:

          - name: name
            label: Artist Name
            type: string
            required: true

          - name: photo
            label: Artist Photo
            type: image

          - name: biography
            label: Biography
            type: rich-text

          - name: website
            label: Website
            type: string


      # -------------------------------------------------------
      # ALBUMS
      # -------------------------------------------------------

      - name: albums
        label: Albums
        type: collection
        path: data/albums
        format: json
        filename: "{primary}.json"

        fields:

          - name: title
            label: Album Title
            type: string
            required: true

          - name: artist
            label: Artist
            type: reference
            options:
              collection: artists
              search: "name"
              label: "{primary}"
              value: "{path}"

          - name: year
            label: Release Year
            type: number

          - name: cover
            label: Cover Artwork
            type: image

          - name: description
            label: Album Description
            type: rich-text

          - name: youtube
            label: YouTube
            type: string

          - name: spotify
            label: Spotify
            type: string

          - name: apple_music
            label: Apple Music
            type: string


      # -------------------------------------------------------
      # SONGS
      # -------------------------------------------------------

      - name: songs
        label: Songs
        type: collection
        path: data/songs
        format: json
        filename: "{primary}.json"

        fields:

          - name: title
            label: Song Title
            type: string
            required: true

          - name: artist
            label: Artist
            type: reference
            options:
              collection: artists
              search: "name"
              label: "{primary}"
              value: "{path}"

          - name: album
            label: Album
            type: reference
            options:
              collection: albums
              search: "title"
              label: "{primary}"
              value: "{path}"

          - name: year
            label: Release Year
            type: number

          - name: cover
            label: Cover Artwork
            type: image

          - name: youtube
            label: YouTube URL
            type: string
            description: Paste the YouTube URL for this song

          - name: spotify
            label: Spotify URL
            type: string

          - name: apple_music
            label: Apple Music URL
            type: string

          - name: description
            label: Description
            type: rich-text

          - name: credits
            label: Credits
            type: text


      # -------------------------------------------------------
      # SINGLES
      # -------------------------------------------------------

      - name: singles
        label: Singles
        type: collection
        path: data/singles
        format: json
        filename: "{primary}.json"

        fields:

          - name: title
            label: Single Title
            type: string
            required: true

          - name: artist
            label: Artist
            type: reference
            options:
              collection: artists
              search: "name"
              label: "{primary}"
              value: "{path}"

          - name: year
            label: Release Year
            type: number

          - name: cover
            label: Cover Artwork
            type: image

          - name: youtube
            label: YouTube URL
            type: string

          - name: spotify
            label: Spotify URL
            type: string

          - name: description
            label: Description
            type: rich-text

          - name: credits
            label: Credits
            type: text


  # =========================================================
  # WORKS
  # =========================================================

  - name: works
    label: WORKS
    type: group
    items:

      # -------------------------------------------------------
      # PRODUCER
      # -------------------------------------------------------

      - name: producer
        label: Producer
        type: collection
        path: data/works/producer
        format: json
        filename: "{primary}.json"

        fields:

          - name: title
            label: Project / Album
            type: string
            required: true

          - name: artist
            label: Artist
            type: reference
            options:
              collection: artists
              search: "name"
              label: "{primary}"
              value: "{path}"

          - name: year
            label: Year
            type: number

          - name: role
            label: Role
            type: string

          - name: cover
            label: Artwork
            type: image

          - name: description
            label: Description
            type: rich-text

          - name: youtube
            label: YouTube
            type: string

          - name: spotify
            label: Spotify
            type: string


      # -------------------------------------------------------
      # COMPOSER
      # -------------------------------------------------------

      - name: composer
        label: Composer
        type: collection
        path: data/works/composer
        format: json
        filename: "{primary}.json"

        fields:

          - name: title
            label: Project / Song
            type: string
            required: true

          - name: artist
            label: Artist
            type: reference
            options:
              collection: artists
              search: "name"
              label: "{primary}"
              value: "{path}"

          - name: year
            label: Year
            type: number

          - name: cover
            label: Artwork
            type: image

          - name: description
            label: Description
            type: rich-text

          - name: youtube
            label: YouTube
            type: string

          - name: credits
            label: Credits
            type: text


      # -------------------------------------------------------
      # ARRANGER
      # -------------------------------------------------------

      - name: arranger
        label: Arranger
        type: collection
        path: data/works/arranger
        format: json
        filename: "{primary}.json"

        fields:

          - name: title
            label: Project / Song
            type: string
            required: true

          - name: artist
            label: Artist
            type: reference
            options:
              collection: artists
              search: "name"
              label: "{primary}"
              value: "{path}"

          - name: year
            label: Year
            type: number

          - name: cover
            label: Artwork
            type: image

          - name: description
            label: Description
            type: rich-text

          - name: youtube
            label: YouTube
            type: string

          - name: credits
            label: Credits
            type: text


      # -------------------------------------------------------
      # OTHER WORKS
      # -------------------------------------------------------

      - name: other
        label: Other Works
        type: collection
        path: data/works/other
        format: json
        filename: "{primary}.json"

        fields:

          - name: title
            label: Project Title
            type: string
            required: true

          - name: artist
            label: Artist
            type: reference
            options:
              collection: artists
              search: "name"
              label: "{primary}"
              value: "{path}"

          - name: year
            label: Year
            type: number

          - name: role
            label: Role
            type: string

          - name: cover
            label: Artwork
            type: image

          - name: description
            label: Description
            type: rich-text

          - name: link
            label: Project Link
            type: string


  # =========================================================
  # ARCHIVE
  # =========================================================

  - name: archive
    label: ARCHIVE
    type: collection
    path: data/archive
    format: json
    filename: "{primary}.json"

    fields:

      - name: title
        label: Title
        type: string
        required: true

      - name: artist
        label: Artist
        type: string

      - name: year
        label: Year
        type: number

      - name: type
        label: Type
        type: select
        options:
          values:
            - Album
            - Single
            - Compilation
            - Production
            - Composition
            - Arrangement
            - Other

      - name: cover
        label: Artwork
        type: image

      - name: description
        label: Description
        type: rich-text

      - name: youtube
        label: YouTube
        type: string

      - name: notes
        label: Archive Notes
        type: text


  # =========================================================
  # GALLERY
  # =========================================================

  - name: gallery
    label: GALLERY
    type: collection
    path: data/gallery
    format: json
    filename: "{primary}.json"

    fields:

      - name: title
        label: Title
        type: string
        required: true

      - name: image
        label: Image
        type: image

      - name: year
        label: Year
        type: number

      - name: description
        label: Description
        type: text


settings:
  content:
    merge: true

  commit:
    identity: app

    templates:
      create: "Add {path}"
      update: "Update {path}"
      delete: "Delete {path}"
      rename: "Rename {oldPath} to {newPath}"
